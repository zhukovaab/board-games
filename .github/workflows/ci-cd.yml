name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend typecheck + build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Схема backend/admin в синхроне
        run: |
          pip install -r backend/requirements.txt -r admin/requirements.txt
          python scripts/check_schema_sync.py

      - name: Docker build backend
        run: docker build ./backend

      - name: Docker build admin
        run: docker build ./admin

      - name: Docker build frontend (prod)
        run: docker build -f frontend/Dockerfile.prod frontend

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Деплой по SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/opt/board-games' }}
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
            docker image prune -f
