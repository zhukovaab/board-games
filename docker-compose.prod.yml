services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/zhukovaab/board-games-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_HOST: db
    volumes:
      - media:/media
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             if [ $${SEED_ON_START:-0} = 1 ]; then python -m app.seed; fi &&
             litestar --app app.main:app run --host 0.0.0.0 --port 8000"

  admin:
    image: ghcr.io/zhukovaab/board-games-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_HOST: db
    volumes:
      - media:/media
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py wait_for_schema &&
             python manage.py migrate --noinput &&
             python manage.py ensure_superuser &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1"

  frontend:
    image: ghcr.io/zhukovaab/board-games-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - admin

volumes:
  pgdata:
  media:
